<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doo</title>
    <link rel="stylesheet" href="src/output.css">
</head>
<body class="bg-gray-200 text-white">
    <section class="my-3.5">
        <nav class="bg-blue-700 py-3.5 px-2 mx-2.5 rounded-md">
            <span class="bg-blue-950 font-bold p-2.5 rounded-md">Doo.io</span>
        </nav>
    </section>
    <section class="flex flex-col items-center justify-center">
        <h1 class="text-4xl text-black font-bold">Add Task</h1>
        <form action="" id="myForm" class="bg-blue-700 py-10 px-5 rounded-sm">
            <input type="text" placeholder="Enter your todo here..." class="input_area border-2 border-blue-300  p-1.5 rounded-md outline-amber-500">
            <button type="submit" id="add_btn" class="bg-blue-950 border-2 border-blue-300  p-1.5 rounded-md font-bold transition hover:bg-blue-500 active:scale-90">Add +</button>
        </form>
    </section>

    <section class="flex flex-col items-center my-5   mx-5 ">
        <h1 class="text-4xl text-black font-bold" id="task_listHeader" customAtt="Yello">Task List</h1>
       <div id="task_list" class="w-full bg-blue-700 p-5 rounded-md md:grid grid-cols-2 gap-5 lg:grid-cols-3">
        
       </div>
    </section>

    <script src="main.js"></script>
    
</body>
</html>
