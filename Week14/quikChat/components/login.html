<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>quikChat</title>
    <link rel="stylesheet" href="/src/output.css">
</head>
<body class="bg-[#002642] text-white">
    <section>
        <nav class="bg-[#840032] p-2.5 rounded-md mx-2.5 my-5">
            <div>
                <span class="font-quant font-bold text-2xl">quikChat</span>
            </div>
        </nav>
    </section>
    <main class="my-16">
        <form action="" class="bg-[#840032] mx-5 py-10 flex flex-col items-center gap-3.5 rounded-md">
            <h2>Sign up</h2>
            <div>
                <h3>Email</h3>
                <input type="text" placeholder="Email" id="email" class="bg-[#002642] p-2.5 rounded-md">
            </div>
        
            <div>
                <h3>Password</h3>
                <input type="password" placeholder="Password" id="password" class="bg-[#002642] p-2.5 rounded-md">
            </div>
        
            <button type="button" id="loginButton" class="bg-[#E59500] py-2.5 px-5 rounded-md">Login</button>
        </form>
        <p class="text-center my-5">Don't have an account? <br> <a href="index.html" id="signUpLink" class="text-[#E59500]">Sign up</a></p>
    </main>

    <footer class="bg-[#E59500] flex flex-col gap-8 p-5 mt-20.5">
        <div>
            <span class="font-quant font-bold text-2xl">quikChat</span>
        </div>
        <div>
            <p>2026</p>
        </div>
    </footer>


    <script src="/js/login.js"></script>
</body>
</html>
