<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scribble</title>
    <link rel="stylesheet" href="src/output.css">
</head>

<body class="bg-[#FEFAE0]">
    <section class="">
        <nav class="bg-[#FAEDCD] px-2.5 py-5 my-5 mx-2.5 rounded-md flex items-center justify-between">
            <div>
                <span class="font-fkause font-bold text-2xl bg-[#D4A373] p-2.5 rounded-2xl text-white">Scrible</span>
            </div>
        
            <svg xmlns="http://www.w3.org/2000/svg" width="27" height="27" fill="currentColor" viewBox="0 0 24 24">
                <path d="M3 5h18v2H3zm0 6h18v2H3zm0 6h18v2H3z"></path>
            </svg>
        </nav>
    </section>

    <main>
        <section id="hero" class="">

            <div class="flex flex-col items-center font-flovers">
                <p class="text-5xl font-bold">Welcome to <span class="font-fkause">srcible!</span></p>
                <p class="text-3xl font-bold">super font formatter</p>
            </div>
        </section>

        <section id="input-section" class="my-10">
            <form action="" class="flex justify-center bg-[#FAEDCD] p-2.5 mx-8 rounded-md">
                <textarea id="live-input" class="h-20 w-64 p-2 bg-white"  name="textarea" rows="5" cols="30" placeholder="Enter your text"></textarea>
            </form>
        </section>

        <section id="output-section" class="my-10">
            <div id="grid-container" class="bg-[#FAEDCD] grid grid-cols-1 gap-5 rounded-md p-2.5 m-2.5">
                <div class="grid--cards bg-[#FEFAE0] rounded-md">
                    <div id="texts" class="p-1.5">
                        <span class="font-bold">Bold:</span>
                        <span id="bold" class="live-output font-bold"></span>
                    </div>
                    
                    <div class="flex justify-between items-center p-1.5">
                        <span>Fonts</span>
                        <div class="flex gap-2.5 text-white font-bold text-xl">
                            <button class="bg-[#D4A373] p-1 w-16 rounded-md transition active:scale-90 font-fdynaPuff" onclick="changeFont('bold', 'font-fdynaPuff')">Hello</button>
                            <button class="bg-[#D4A373] p-1 w-16 rounded-md transition active:scale-90 font-fc-girls" onclick="changeFont('bold', 'font-fc-girls')">Hello</button>
                            <button class="bg-[#D4A373] p-1 w-16 rounded-md transition active:scale-90 font-flovers" onclick="changeFont('bold', 'font-flovers')">Hello</button>
                        </div>
                        
                    </div>
                </div>

                <div class="grid--cards bg-[#FEFAE0] rounded-md">
                    <div id="texts" class="p-1.5 overflow-x-clip">
                        <span class="font-bold">Italic:</span>
                        <span id="italic" class="italic live-output font-bold"></span>
                    </div>
                    
                    <div class="flex justify-between items-center p-1.5">
                        <span>Fonts</span>
                        <div class="flex gap-2.5 text-white font-bold text-xl">
                            <button class="bg-[#D4A373] p-1 w-16 rounded-md transition active:scale-90 font-fdynaPuff" onclick="changeFont('italic', 'font-fdynaPuff')">Hello</button>
                            <button class="bg-[#D4A373] p-1 w-16 rounded-md transition active:scale-90 font-fc-girls" onclick="changeFont('italic', 'font-fc-girls')">Hello</button>
                            <button class="bg-[#D4A373] p-1 w-16 rounded-md transition active:scale-90 font-flovers" onclick="changeFont('italic', 'font-flovers')">Hello</button>
                        </div>
                        
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="bg-black py-7 px-5 mt-10">
        <div>
            <span class="font-fkause font-bold text-2xl bg-[#D4A373] p-2.5 rounded-2xl text-white">Scrible</span>
        </div>
        <div class="flex justify-center gap-2.5 mt-10">
            <span class="text-white">2026</span>
            <a href="https://github.com/MP-XXL">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="2 2 20 20" class="text-white">
                    <path fill-rule="evenodd"
                        d="M12.026 2c-5.509 0-9.974 4.465-9.974 9.974 0 4.406 2.857 8.145 6.821 9.465.499.09.679-.217.679-.481 0-.237-.008-.865-.011-1.696-2.775.602-3.361-1.338-3.361-1.338-.452-1.152-1.107-1.459-1.107-1.459-.905-.619.069-.605.069-.605 1.002.07 1.527 1.028 1.527 1.028.89 1.524 2.336 1.084 2.902.829.091-.645.351-1.085.635-1.334-2.214-.251-4.542-1.107-4.542-4.93 0-1.087.389-1.979 1.024-2.675-.101-.253-.446-1.268.099-2.64 0 0 .837-.269 2.742 1.021a9.6 9.6 0 0 1 2.496-.336 9.6 9.6 0 0 1 2.496.336c1.906-1.291 2.742-1.021 2.742-1.021.545 1.372.203 2.387.099 2.64.64.696 1.024 1.587 1.024 2.675 0 3.833-2.33 4.675-4.552 4.922.355.308.675.916.675 1.846 0 1.334-.012 2.41-.012 2.737 0 .267.178.577.687.479C19.146 20.115 22 16.379 22 11.974 22 6.465 17.535 2 12.026 2"
                        clip-rule="evenodd"></path>
                </svg>
            </a>
        </div>
    </footer>

    <script src="main.js"></script>

</body>

</html>
